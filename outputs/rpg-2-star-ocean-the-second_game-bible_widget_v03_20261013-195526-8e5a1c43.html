<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#151b24">
  <title>世界之间 · 游戏圣经</title>
  <link rel="stylesheet" href="/bible.css">
  <script defer src="/bible.js"></script>
</head>
<body>
  <div class="shell">
    <header class="site-header">
      <div class="eyebrow">WORLDS BETWEEN · GAME BIBLE</div>
      <div class="header-line"><h1>世界之间</h1><span class="edition" id="edition">载入中</span></div>
      <p class="tagline" id="pitch">正在读取项目设定…</p>
      <label class="search-wrap">
        <span class="visually-hidden">搜索游戏圣经</span>
        <input id="search" type="search" placeholder="搜索规则、人物、板块或资产" autocomplete="off">
      </label>
    </header>
    <nav class="main-nav" aria-label="游戏圣经章节">
      <button type="button" data-view="home">总览</button>
      <button type="button" data-view="world">世界</button>
      <button type="button" data-view="rules">规则</button>
      <button type="button" data-view="characters">角色</button>
      <button type="button" data-view="production">制作</button>
      <button type="button" data-view="assets">资产</button>
    </nav>
    <main id="content" tabindex="-1" aria-live="polite"><p class="loading">正在载入游戏圣经…</p></main>
    <footer class="site-footer"><span id="footer-status">本地项目资料</span><span>设计稿与素材状态分开记录</span></footer>
  </div>
</body>
</html>
